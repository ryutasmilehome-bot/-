<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FLASH ANZAN</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:black;
  color:#00ff00;
  font-family:'Press Start 2P', monospace;
  text-align:center;
}

/* タイトル */
#titleScreen{
  position:fixed;
  width:100%;height:100%;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:9999;
}
.press-start{animation:blink 1s infinite;}
@keyframes blink{50%{opacity:0;}}

/* メイン */
.main{
  width:300px;height:200px;
  margin:20px auto;
  display:flex;
  align-items:center;
  justify-content:center;
  border:4px solid #0f0;
}
#number{
  font-size:60px;
  text-shadow:0 0 10px #0f0;
}

/* UI */
.controls{
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:10px;
}
select,button,input{
  background:black;
  color:#0f0;
  border:2px solid #0f0;
  padding:10px;
}

#timer{margin-top:10px;}
.danger{color:red;animation:blink 0.5s infinite;}

.glow{ text-shadow:0 0 20px #0f0,0 0 40px #0f0; }
</style>
</head>

<body>

<div id="titleScreen">
  <h1>FLASH ANZAN</h1>
  <div class="press-start">PRESS START</div>
</div>

<div id="rankBoard">段位:<span id="rank">10</span>級</div>
<div id="timer">TIME:<span id="time">0</span></div>

<div class="main">
  <div id="number"></div>
</div>

<div class="controls">
<select id="mode">
  <option value="flash">フラッシュ</option>
  <option value="normal">見取り算</option>
  <option value="exam">段位試験</option>
</select>

<select id="digit">
<option value="1">1桁</option>
<option value="2">2桁</option>
<option value="3">3桁</option>
</select>

<select id="count">
<option>5</option><option>10</option><option>15</option>
</select>

<select id="speed">
<option value="0.1">0.1</option>
<option value="0.3">0.3</option>
<option value="0.5">0.5</option>
<option value="1">1</option>
</select>

<button onclick="start()">START</button>

<div id="answerArea" style="display:none;">
<input id="answer">
<button onclick="check()">CHECK</button>
</div>

<div id="result"></div>
</div>

<script>
/* ===== 状態 ===== */
let state = "idle";

/* ===== 変数 ===== */
let numbers=[],index=0,sum=0;
let mode;
let timer=null,timeLeft=0;
let examSet=1,passCount=0,currentRank=10;
let currentExamTime=0;

let audioCtx;

/* ===== DOM ===== */
const numberEl = document.getElementById("number");
const result = document.getElementById("result");
const answerArea = document.getElementById("answerArea");
const answer = document.getElementById("answer");
const rankEl = document.getElementById("rank");
const timeEl = document.getElementById("time");

/* ===== 音 ===== */
function initAudio(){
  if(!audioCtx){
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  }
  audioCtx.resume();
}
function beep(f=800,d=0.05){
  if(!audioCtx) return;
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.frequency.value=f;
  g.gain.value=0.2;
  o.connect(g); g.connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime+d);
}

/* ===== タイトル ===== */
document.getElementById("titleScreen").onclick=()=>{
  initAudio();
  beep(1000);
  document.getElementById("titleScreen").style.display="none";
};

/* ===== 数生成 ===== */
function gen(d){
  let min=d==1?0:10**(d-1);
  let max=10**d-1;
  return Math.floor(Math.random()*(max-min+1))+min;
}

/* ===== スタート ===== */
function start(){
  if(state!=="idle" && state!=="input") return;

  initAudio();

  clearInterval(timer);

  numbers=[];sum=0;index=0;
  result.textContent="";
  answer.value="";
  answerArea.style.display="none";

  mode=document.getElementById("mode").value;

  rankEl.textContent=currentRank;

  if(mode==="exam"){
    examSet=1;passCount=0;
    startExam();
    return;
  }

  let digit=Number(document.getElementById("digit").value);
  let count=Number(document.getElementById("count").value);

  for(let i=0;i<count;i++){
    let n=gen(digit);
    numbers.push(n);
    sum+=n;
  }

  if(mode==="normal"){
    numberEl.textContent=numbers.join(" ");
    answerArea.style.display="block";
    state="input";
  }else{
    countdown(3);
  }
}

/* ===== カウントダウン ===== */
function countdown(n){
  state="countdown";

  if(n>0){
    numberEl.textContent=n;
    beep(1200);

    let u=new SpeechSynthesisUtterance(["","One","Two","Three"][n]);
    u.lang="en-US";
    speechSynthesis.speak(u);

    setTimeout(()=>countdown(n-1),800);
  }else{
    showNext();
  }
}

/* ===== 表示 ===== */
function showNext(){
  state="showing";
  let speed=Number(document.getElementById("speed").value)*1000;

  if(index<numbers.length){
    numberEl.textContent="";
    setTimeout(()=>{
      numberEl.textContent=numbers[index];
      beep(800);
      index++;
      setTimeout(showNext,speed);
    },80);
  }else{
    numberEl.textContent="?";
    answerArea.style.display="block";
    state="input";

    // ★ここでタイマー開始
    if(mode==="exam"){
      startTimer(currentExamTime);
    }
  }
}

/* ===== 判定 ===== */
function check(){
  if(state!=="input") return;

  let user=Number(answer.value);

  if(mode==="exam"){
    if(user===sum){
      passCount++;
      beep(1000);
    }else{
      fail("誤答");
      return;
    }

    examSet++;
    if(examSet<=3){
      setTimeout(startExam,1500);
    }else{
      finishExam();
    }
    return;
  }

  result.textContent = user===sum ? "PASS" : "FAIL 正解:"+sum;
  state="idle";
}

/* ===== 試験 ===== */
function startExam(){
  let cfg=getLevel(currentRank);

  currentExamTime=cfg.time;

  numbers=[];sum=0;index=0;

  rankEl.textContent=currentRank;

  for(let i=0;i<cfg.count;i++){
    let n=gen(cfg.digit);
    numbers.push(n); sum+=n;
  }

  countdown(3);
}

/* ===== タイマー ===== */
function startTimer(t){
  clearInterval(timer);
  timeLeft=t;

  timeEl.classList.remove("danger");
  timeEl.textContent=timeLeft;

  timer=setInterval(()=>{
    timeLeft--;
    timeEl.textContent=timeLeft;

    if(timeLeft<=3){
      timeEl.classList.add("danger");
      beep(1200);
    }

    if(timeLeft<=0){
      fail("時間切れ");
    }
  },1000);
}

/* ===== 失格 ===== */
function fail(msg){
  state="gameover";
  clearInterval(timer);
  result.textContent="失格:"+msg;
  beep(200,0.3);
}

/* ===== 終了 ===== */
function finishExam(){
  clearInterval(timer);

  let pass=passCount>=2;

  if(pass && currentRank>1) currentRank--;

  localStorage.setItem("rank",currentRank);
  rankEl.textContent=currentRank;

  result.textContent="試験終了："+(pass?"合格":"不合格");

  if(pass){
    result.classList.add("glow");
    beep(1200);
  }

  state="idle";
}

/* ===== 段位設定 ===== */
function getLevel(l){
  if(l>=8)return{digit:1,count:5,time:12};
  if(l>=5)return{digit:2,count:10,time:10};
  if(l>=2)return{digit:2,count:15,time:8};
  return{digit:3,count:15,time:6};
}

/* 初期 */
window.onload=()=>{
  let r=localStorage.getItem("rank");
  if(r) currentRank=r;
  rankEl.textContent=currentRank;
};
</script>

</body>
</html>
