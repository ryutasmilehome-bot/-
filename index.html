<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FLASH ANZAN</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: black;
  color: #00ff00;
  font-family: 'Press Start 2P', monospace;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* タイトル */
.header {
  text-align: center;
  padding: 10px;
  border-bottom: 2px solid #00ff00;
}

/* 固定枠 */
.main {
  width: 300px;
  height: 200px;
  margin: 20px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 4px solid #00ff00;
}

/* ゴースト表示（位置固定トリック） */
.display-wrapper {
  position: relative;
  width: 220px;
  height: 80px;
}

.ghost {
  color: transparent;
  font-size: 60px;
  letter-spacing: 10px;
}

#number {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  font-size: 60px;
  text-align: center;
  letter-spacing: 10px;
  text-shadow: 0 0 10px #00ff00;
}

/* 操作 */
.controls {
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

select, input, button {
  background: black;
  color: #00ff00;
  border: 2px solid #00ff00;
  padding: 10px;
}

button:active {
  background: #00ff00;
  color: black;
}
</style>
</head>

<body>

<div class="header">FLASH ANZAN</div>

<div class="main">
  <div class="display-wrapper">
    <div class="ghost">888</div>
    <div id="number"></div>
  </div>
</div>

<div class="controls">

<label>桁数</label>
<select id="digit">
  <option value="1">1桁</option>
  <option value="2">2桁</option>
  <option value="3">3桁</option>
</select>

<label>口数</label>
<input type="number" id="count" value="10">

<label>秒数（表示間隔）</label>
<input type="number" id="speed" step="0.1" value="0.5">

<button onclick="start()">START</button>

<div id="answerArea" style="display:none;">
  <input type="number" id="answer" placeholder="ANS">
  <button onclick="check()">CHECK</button>
</div>

<div id="result"></div>

</div>

<script>
let numbers = [];
let index = 0;
let sum = 0;

/* 数生成 */
function generateNumber(digit) {
  let min = Math.pow(10, digit - 1);
  let max = Math.pow(10, digit) - 1;
  if (digit === 1) min = 0;
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

/* 表示 */
function displayNumber(num) {
  const el = document.getElementById("number");

  if (num === "" || num === "?") {
    el.textContent = "";
  } else {
    el.textContent = num;
  }
}

/* スタート */
function start() {
  numbers = [];
  index = 0;
  sum = 0;

  document.getElementById("answerArea").style.display = "none";
  document.getElementById("result").textContent = "";

  let digit = Number(document.getElementById("digit").value);
  let count = Number(document.getElementById("count").value);

  for (let i = 0; i < count; i++) {
    let num = generateNumber(digit);
    numbers.push(num);
    sum += num;
  }

  countdown(3);
}

/* カウントダウン */
function countdown(n) {
  if (n > 0) {
    displayNumber(n);
    setTimeout(() => countdown(n - 1), 800);
  } else {
    setTimeout(showNext, 300);
  }
}

/* フラッシュ表示 */
function showNext() {
  let speed = Number(document.getElementById("speed").value) * 1000;

  if (index < numbers.length) {

    displayNumber(""); // 一瞬消す

    setTimeout(() => {
      displayNumber(numbers[index]);
      index++;
      setTimeout(showNext, speed);
    }, 80);

  } else {
    displayNumber("?");
    document.getElementById("answerArea").style.display = "block";
  }
}

/* 判定 */
function check() {
  let user = Number(document.getElementById("answer").value);

  if (user === sum) {
    document.getElementById("result").textContent = "PASS";
  } else {
    document.getElementById("result").textContent = "FAIL 正解:" + sum;
  }
}
</script>

</body>
</html>
